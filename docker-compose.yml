services:
  postgres:
    image: postgres:16-alpine
    container_name: vidacruz-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  kafka:
    image: apache/kafka:3.9.1
    container_name: vidacruz-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:19092,CONTROLLER://:9093,EXTERNAL://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  kafka-init:
    image: apache/kafka:3.9.1
    container_name: vidacruz-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092
        --create --if-not-exists
        --topic triaje.eventos --partitions 3 --replication-factor 1

  redis:
    image: redis:7-alpine
    container_name: vidacruz-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  triage-service:
    build:
      context: ${TRIAGE_CONTEXT:-../triage-vida-cruz}
    image: vidacruz/triage-service:local
    container_name: vidacruz-triage
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      TRIAGE_KAFKA_BOOTSTRAPSERVERS: kafka:19092
      TRIAGE_SECURITY_APIKEYS: ${TRIAGE_SECURITY_APIKEYS:?TRIAGE_SECURITY_APIKEYS is required (16+ characters)}
      TRIAGE_ALERTS_WEBHOOK_URL: ${TRIAGE_ALERTS_WEBHOOK_URL:-}
      # To try escalation quickly, uncomment: TRIAGE_SLA_CRITICO: "1" and TRIAGE_SLAMONITOR_INTERVAL: "2s"
    ports:
      - "8081:8081"
    restart: unless-stopped

  assistant-service:
    build:
      context: ${ASSISTANT_CONTEXT:-../assistant-service}
    image: vidacruz/assistant-service:local
    container_name: vidacruz-assistant
    depends_on:
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    environment:
      REDIS_HOST: redis
      ASSISTANT_KAFKA_BOOTSTRAPSERVERS: kafka:19092
      ASSISTANT_SECURITY_APIKEYS: ${ASSISTANT_SECURITY_APIKEYS:?ASSISTANT_SECURITY_APIKEYS is required (16+ characters)}
      # Optional: without a key the assistant starts and answers 503 (degraded mode)
      GEMINI_API_KEY: ${GEMINI_API_KEY:-not-configured}
      GEMINI_CHAT_MODEL: ${GEMINI_CHAT_MODEL:-gemini-3.5-flash}
    ports:
      - "8082:8082"
    restart: unless-stopped

volumes:
  postgres_data: