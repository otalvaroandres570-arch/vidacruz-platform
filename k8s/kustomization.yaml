apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: vidacruz

resources:
  - namespace.yaml
  - postgres.yaml
  - redis.yaml
  - kafka.yaml
  - kafka-init-job.yaml
  - triage.yaml
  - assistant.yaml

images:
  - name: vidacruz/triage-service
    newName: vidacruz/triage-service
    newTag: local
  - name: vidacruz/assistant-service
    newName: vidacruz/assistant-service
    newTag: local