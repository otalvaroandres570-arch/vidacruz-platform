apiVersion: batch/v1
kind: Job
metadata:
  name: kafka-init
  labels:
    app.kubernetes.io/name: kafka-init
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kafka-init
    spec:
      restartPolicy: OnFailure
      containers:
        - name: create-topic
          image: apache/kafka:3.9.1
          command: ["/bin/sh", "-c"]
          args:
            - >
              until /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --list > /dev/null 2>&1;
              do echo "waiting for kafka"; sleep 3; done;
              /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092
              --create --if-not-exists --topic triaje.eventos --partitions 3 --replication-factor 1