apiVersion: v1
kind: ConfigMap
metadata:
  name: assistant-config
data:
  SPRING_PROFILES_ACTIVE: json
  REDIS_HOST: redis
  ASSISTANT_KAFKA_BOOTSTRAPSERVERS: kafka:9092
  GEMINI_CHAT_MODEL: gemini-3.5-flash
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: assistant-service
  labels:
    app.kubernetes.io/name: assistant-service
    app.kubernetes.io/part-of: vidacruz
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: assistant-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: assistant-service
        app.kubernetes.io/part-of: vidacruz
    spec:
      enableServiceLinks: false
      terminationGracePeriodSeconds: 40
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: assistant-service
          image: vidacruz/assistant-service
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8082
          envFrom:
            - configMapRef:
                name: assistant-config
          env:
            - name: ASSISTANT_SECURITY_APIKEYS
              valueFrom:
                secretKeyRef:
                  name: vidacruz-secrets
                  key: ASSISTANT_SECURITY_APIKEYS
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: vidacruz-secrets
                  key: GEMINI_API_KEY
                  optional: true
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 5
            failureThreshold: 36
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: assistant-service
  labels:
    app.kubernetes.io/name: assistant-service
spec:
  type: LoadBalancer
  selector:
    app.kubernetes.io/name: assistant-service
  ports:
    - name: http
      port: 8082
      targetPort: http